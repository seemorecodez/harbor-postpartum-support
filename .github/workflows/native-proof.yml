name: Native architecture proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-native-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android engineering release
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Record Android toolchain
        run: flutter doctor -v

      - name: Resolve the committed dependency lock
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned release APK
        run: flutter build apk --release --no-pub

      - name: Verify compiled Android privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -f "$apk"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print | sort | tail -n 1)"
          test -n "$apkanalyzer"
          manifest_report="$RUNNER_TEMP/harbor-compiled-android-manifest.xml"
          "$apkanalyzer" manifest print "$apk" > "$manifest_report"
          grep -F 'android:label="Harbor"' "$manifest_report"
          grep -F 'android:allowBackup="false"' "$manifest_report"
          grep -F 'android:usesCleartextTraffic="false"' "$manifest_report"
          if grep -Fq 'android.permission.INTERNET' "$manifest_report"; then
            echo 'Release APK unexpectedly requests INTERNET.' >&2
            exit 1
          fi

      - name: Verify build did not change governed source
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve Android engineering proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harbor-android-engineering-proof-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows engineering release
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Record Windows toolchain
        run: flutter doctor -v

      - name: Resolve the committed dependency lock
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned Windows release
        run: flutter build windows --release --no-pub

      - name: Verify compiled Windows product boundary
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem build/windows -Recurse -File -Filter Harbor.exe)
          if ($executables.Count -ne 1) { throw "Expected one Harbor.exe; found $($executables.Count)." }
          $assets = Join-Path $executables[0].DirectoryName 'data/flutter_assets'
          if (-not (Test-Path -LiteralPath $assets -PathType Container)) { throw 'Flutter assets are missing.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $executables[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Expected an unsigned engineering binary; found $($signature.Status)." }

      - name: Verify build did not change governed source
        shell: pwsh
        run: |
          git diff --exit-code
          $untracked = @(git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect untracked files.' }
          if ($untracked.Count -gt 0) {
            $untracked | ForEach-Object { Write-Error "Unexpected untracked file: $_" }
            throw 'Build created untracked governed source.'
          }

      - name: Preserve Windows engineering proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harbor-windows-engineering-proof-${{ github.sha }}
          path: build/windows/**/runner/Release
          if-no-files-found: error
          retention-days: 3

  apple:
    name: Build Apple engineering releases
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Record Apple toolchain
        run: flutter doctor -v

      - name: Resolve the committed dependency lock
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned macOS release
        run: flutter build macos --release --no-pub

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign --no-pub

      - name: Verify compiled Apple product names
        shell: bash
        run: |
          set -euo pipefail
          mac_app='build/macos/Build/Products/Release/Harbor.app'
          ios_app='build/ios/iphoneos/Runner.app'
          test -d "$mac_app"
          test -d "$ios_app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$mac_app/Contents/Info.plist")" = 'Harbor'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$ios_app/Info.plist")" = 'Harbor'

      - name: Verify builds did not change governed source
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve Apple engineering proofs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harbor-apple-engineering-proof-${{ github.sha }}
          path: |
            build/macos/Build/Products/Release/*.app
            build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 3
