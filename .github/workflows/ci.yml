name: Verify Harbor

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbor-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Record toolchain
        run: flutter --version

      - name: Resolve the committed dependency lock
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Run encrypted data integrity and search workload
        run: flutter test --no-pub tool/performance_probe_test.dart

      - name: Preserve visual-regression differences
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harbor-golden-failures-${{ github.sha }}
          path: test/failures
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release WebAssembly web app
        run: flutter build web --release --wasm --no-pub

      - name: Pin and verify release asset integrity
        run: |
          dart run tool/finalize_web_release.dart build/web
          dart run tool/finalize_web_release.dart --verify build/web

      - name: Generate and verify the locked CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          dart pub deps --json > build/harbor-dependencies.json
          dart run tool/generate_sbom.dart \
            build/harbor-dependencies.json pubspec.lock \
            build/harbor-web.cdx.json
          dart run tool/generate_sbom.dart --verify \
            build/harbor-dependencies.json pubspec.lock \
            build/harbor-web.cdx.json

      - name: Verify commands did not change governed source
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Preserve the verified web build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harbor-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Sign web artifact build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2

      - name: Sign web artifact SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: build/harbor-web.cdx.json

      - name: Preserve signed release evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          cp "${{ steps.attest_provenance.outputs.bundle-path }}" \
            build/release-evidence/provenance.sigstore.json
          cp "${{ steps.attest_sbom.outputs.bundle-path }}" \
            build/release-evidence/sbom.sigstore.json
          cp build/harbor-web.cdx.json build/release-evidence/

      - name: Upload signed release evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: harbor-release-evidence-${{ github.sha }}
          path: build/release-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Build and verify the GitHub Pages subpath artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base_href='/'
          else
            base_href="/$repository_name/"
          fi
          flutter build web --release --wasm --no-pub \
            --base-href "$base_href" \
            --output "$GITHUB_WORKSPACE/build/pages"
          dart run tool/finalize_web_release.dart build/pages
          dart run tool/finalize_web_release.dart --verify build/pages
          grep -F "<base href=\"$base_href\">" build/pages/index.html

      - name: Upload the verified GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
          retention-days: 1

  deploy_pages:
    name: Deploy verified web artifact to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
